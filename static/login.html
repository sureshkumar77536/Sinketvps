<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SinketVPS · Access</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --accent:#19e3ff;
    --accent2:#0a84ff;
  }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:#050607;
    color:#fff; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center; min-height:100dvh;
  }
  /* animated ambient glow background */
  body::before{
    content:""; position:fixed; inset:-30%;
    background:
      radial-gradient(40% 35% at 30% 25%, rgba(25,227,255,.10), transparent 60%),
      radial-gradient(45% 40% at 75% 75%, rgba(10,132,255,.10), transparent 60%);
    filter:blur(20px); animation:drift 16s ease-in-out infinite alternate; z-index:0;
  }
  @keyframes drift{ from{transform:translate(-3%, -2%) scale(1);} to{transform:translate(3%, 2%) scale(1.08);} }
  /* fine grid texture */
  body::after{
    content:""; position:fixed; inset:0; z-index:0; opacity:.35;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
            mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
  }

  .card{
    position:relative; z-index:2; width:360px; max-width:90vw;
    padding:38px 30px 32px;
    border-radius:22px;
    background:linear-gradient(160deg, rgba(28,30,34,.72), rgba(10,11,13,.82));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
      0 1px 0 rgba(255,255,255,.10) inset,
      0 -1px 0 rgba(0,0,0,.6) inset,
      0 30px 80px rgba(0,0,0,.7),
      0 0 0 1px rgba(0,0,0,.5);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    text-align:center; overflow:hidden;
  }
  /* top shine sweep */
  .card .shine{
    position:absolute; top:0; left:-60%; width:60%; height:100%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.07), transparent);
    transform:skewX(-18deg); animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{ 0%,70%{left:-60%;} 100%{left:140%;} }

  .dots{ display:flex; gap:9px; margin-bottom:30px; }
  .dot{ width:13px;height:13px;border-radius:50%; position:relative;
        box-shadow:0 1px 2px rgba(0,0,0,.6), 0 0 0 .5px rgba(0,0,0,.4) inset; }
  .dot::after{ content:""; position:absolute; top:2px; left:2.5px; width:5px; height:4px;
               border-radius:50%; background:rgba(255,255,255,.55); filter:blur(.5px); }
  .r{background:radial-gradient(circle at 35% 30%, #ff8a82, #ff5f56);}
  .y{background:radial-gradient(circle at 35% 30%, #ffd479, #ffbd2e);}
  .g{background:radial-gradient(circle at 35% 30%, #74e98a, #27c93f);}

  .badge{
    width:78px; height:78px; margin:0 auto 18px; border-radius:20px;
    display:flex; align-items:center; justify-content:center; font-size:38px;
    background:linear-gradient(160deg, #1b1d21, #0a0b0d);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      0 1px 0 rgba(255,255,255,.12) inset,
      0 -2px 6px rgba(0,0,0,.6) inset,
      0 14px 30px rgba(0,0,0,.6),
      0 0 26px rgba(25,227,255,.18);
    position:relative;
  }
  .badge::before{
    content:""; position:absolute; inset:0; border-radius:20px;
    background:linear-gradient(180deg, rgba(255,255,255,.10), transparent 45%);
  }

  h1{ font-size:23px; font-weight:700; letter-spacing:.3px;
      background:linear-gradient(180deg,#fff,#b9bdc4);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub{ font-size:12.5px; color:#7d838c; margin:5px 0 28px; letter-spacing:1.5px; text-transform:uppercase; }

  .field{ position:relative; margin-bottom:6px; }
  input{
    width:100%; padding:15px 16px; border-radius:13px;
    border:1px solid rgba(255,255,255,.10);
    background:linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.3));
    color:#fff; font-size:15px; outline:none; letter-spacing:1px;
    box-shadow:0 2px 8px rgba(0,0,0,.4) inset;
    transition:border-color .25s, box-shadow .25s;
  }
  input::placeholder{ color:#5a5f66; letter-spacing:.5px; }
  input:focus{
    border-color:rgba(25,227,255,.55);
    box-shadow:0 2px 8px rgba(0,0,0,.4) inset, 0 0 0 3px rgba(25,227,255,.14), 0 0 18px rgba(25,227,255,.15);
  }

  button{
    width:100%; margin-top:18px; padding:15px; cursor:pointer;
    border:1px solid rgba(255,255,255,.10); border-radius:13px;
    color:#eafcff; font-size:15px; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(180deg, #14171b, #0a0c0e);
    box-shadow:
      0 1px 0 rgba(255,255,255,.14) inset,
      0 -2px 6px rgba(0,0,0,.5) inset,
      0 10px 26px rgba(0,0,0,.55),
      0 0 0 1px rgba(25,227,255,.0);
    transition:transform .12s, box-shadow .25s, border-color .25s;
    position:relative; overflow:hidden;
  }
  button:hover{ border-color:rgba(25,227,255,.4);
    box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 -2px 6px rgba(0,0,0,.5) inset,
               0 10px 26px rgba(0,0,0,.55), 0 0 22px rgba(25,227,255,.22); }
  button:active{ transform:translateY(1px) scale(.99); }
  button .glow{ position:absolute; inset:0; border-radius:13px;
    background:linear-gradient(180deg, rgba(25,227,255,.10), transparent 60%); pointer-events:none; }

  .err{ color:#ff6b6b; font-size:12.5px; margin-top:15px; min-height:16px; letter-spacing:.3px; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <span class="shine"></span>
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="badge">🖥️</div>
    <h1>SinketVPS</h1>
    <div class="sub">Secure Terminal Access</div>
    <div class="field">
      <input type="password" name="password" placeholder="Enter access key" autofocus autocomplete="current-password">
    </div>
    <button type="submit"><span class="glow"></span>Unlock Terminal →</button>
    <div class="err">{{ error }}</div>
  </form>
</body>
</html>
